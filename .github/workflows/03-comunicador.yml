name: Comunicador

on:
    workflow_dispatch:
        inputs:
            villano:
                description: "¿Qué villano envia el mensaje?"
                required: true
                type: choice
                options:
                    - Joker
                    - Thanos
                    - Darth Vader

            mensaje:
                description: "Mensaje para el consejo"
                required: true
                default: "¡Hola, consejo! La misión fue todo un éxito"

            cow_character:
                description: "¿Qué personaje de vaca quieres?"
                required: true
                type: choice
                options:
                    - eyes
                    - bunny
                    - dragon
            
            prioridad:
                description: "¿Qué nivel de prioridad tiene?"
                required: true
                type: choice
                options:
                    - 🟢 Normal
                    - 🟡 Alta
                    - 🔴 Crítica

jobs:
    transmitir-mensaje:
        runs-on: ubuntu-latest

        steps:

            - name: Instalar el transmisor de la legión
              run: sudo apt-get install -y cowsay

            - name: Imprimir inputs
              run: |
                echo "================================="
                echo "    Transmisión interceptada     "
                echo "================================="
                echo ""
                echo "De: ${{ inputs.villano }}"
                echo ""
                echo "Fecha: $(date -u + "%d/%m/%Y - %H:%M UTC")"
                echo "====== Mensaje ======"
                cowsay -f ${{ inputs.cow_character }} "${{ inputs.mensaje }}"
                echo ""
                echo "---- ${{inputs.villano }}"
                echo "..."

