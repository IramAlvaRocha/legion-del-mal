name: Comunicador

on:
    workflow_dispatch:
        inputs:
            villano:
                description: "¿Qué villano envia el mensaje?"
                required: true
                type: choice
                options:
                    - Joker
                    - Thanos
                    - Darth Vader

            mensaje:
                description: "Mensaje para el consejo"
                required: true
                default: "¡Hola, consejo! La misión fue todo un éxito"
            
            prioridad:
                description: "¿Qué nivel de prioridad tiene?"
                required: true
                type: choice
                options:
                    - 🟢 Normal
                    - 🟡 Alta
                    - 🔴 Crítica

jobs:
    transmitir-mensaje:
        runs-on: ubuntu-latest

        steps:
            - name: Imprimir inputs
              run: |
                echo "Inputs: "
                echo ""
                echo "Villano: ${{ github.event.inputs.villano }}"
                echo "Prioridad: ${{ github.event.inputs.prioridad }}"
                echo "Mensaje: ${{ github.event.inputs.mensaje }}"